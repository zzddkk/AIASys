name: Secret Scan

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    # 硬上限：没有它时挂起的 job 会跑到 GitHub 默认的 6 小时上限。
    # 挂起比失败更糟——看不到结论、烧配额、还阻塞队列。全仓密钥扫描。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        shell: bash
        run: |
          # CI 模式下只跑轻量扫描，避免超时
          bash scripts/security/scan-secrets-ci.sh
